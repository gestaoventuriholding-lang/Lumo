<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Protótipo das telas de operação ao vivo (dados de exemplo). Abra direto no navegador. -->
<title>Central de Atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar fixa de vidro + área principal com grade de painéis de vidro sobre um fundo azul-céu com brilhos difusos */
:root{
  --sky-1:#e6f3ff; --sky-2:#cfe7ff; --sky-3:#b6dcff;
  --glow-a:#8fd0ff; --glow-b:#a9c8ff; --glow-c:#c7f0ff;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-soft:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.85); --edge-dim:rgba(120,170,215,.28);
  --ink:#0f2a44; --ink-2:#3c5a78; --ink-3:#6c87a2;
  --accent:#1f8fe0; --accent-ink:#ffffff; --accent-soft:rgba(31,143,224,.14);
  --ok:#14966a; --ok-soft:rgba(20,150,106,.14);
  --warn:#c97a07; --warn-soft:rgba(201,122,7,.15);
  --crit:#d23c4b; --crit-soft:rgba(210,60,75,.13);
  --pause:#7a5cd6; --pause-soft:rgba(122,92,214,.14);
  --off:#7d8fa3; --off-soft:rgba(125,143,163,.16);
  --shadow:0 10px 30px rgba(40,100,160,.12),0 1px 0 rgba(255,255,255,.6) inset;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky-1:#071a2e; --sky-2:#0a2440; --sky-3:#0d2f52;
  --glow-a:#1e6fb0; --glow-b:#2a4f9a; --glow-c:#13708a;
  --glass:rgba(160,205,255,.08); --glass-strong:rgba(160,205,255,.13); --glass-soft:rgba(160,205,255,.05);
  --edge:rgba(170,215,255,.22); --edge-dim:rgba(170,215,255,.12);
  --ink:#e7f3ff; --ink-2:#a9c6e3; --ink-3:#7393b3;
  --accent:#5cb8ff; --accent-ink:#04203a; --accent-soft:rgba(92,184,255,.16);
  --ok:#3fd09b; --ok-soft:rgba(63,208,155,.15);
  --warn:#f2b247; --warn-soft:rgba(242,178,71,.15);
  --crit:#ff7584; --crit-soft:rgba(255,117,132,.15);
  --pause:#b19cff; --pause-soft:rgba(177,156,255,.15);
  --off:#8aa0b8; --off-soft:rgba(138,160,184,.14);
  --shadow:0 12px 34px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.06) inset;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sky-1:#071a2e; --sky-2:#0a2440; --sky-3:#0d2f52;
  --glow-a:#1e6fb0; --glow-b:#2a4f9a; --glow-c:#13708a;
  --glass:rgba(160,205,255,.08); --glass-strong:rgba(160,205,255,.13); --glass-soft:rgba(160,205,255,.05);
  --edge:rgba(170,215,255,.22); --edge-dim:rgba(170,215,255,.12);
  --ink:#e7f3ff; --ink-2:#a9c6e3; --ink-3:#7393b3;
  --accent:#5cb8ff; --accent-ink:#04203a; --accent-soft:rgba(92,184,255,.16);
  --ok:#3fd09b; --ok-soft:rgba(63,208,155,.15);
  --warn:#f2b247; --warn-soft:rgba(242,178,71,.15);
  --crit:#ff7584; --crit-soft:rgba(255,117,132,.15);
  --pause:#b19cff; --pause-soft:rgba(177,156,255,.15);
  --off:#8aa0b8; --off-soft:rgba(138,160,184,.14);
  --shadow:0 12px 34px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.06) inset;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--sky-1),var(--sky-2) 55%,var(--sky-3));background-color:var(--sky-1);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100%;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--glow-a)}
.bg i:nth-child(2){width:38vw;height:38vw;right:-8vw;top:18vh;background:var(--glow-b)}
.bg i:nth-child(3){width:42vw;height:42vw;left:30vw;bottom:-18vw;background:var(--glow-c)}
@media (prefers-reduced-motion:no-preference){.bg i{animation:drift 26s ease-in-out infinite alternate}.bg i:nth-child(2){animation-duration:32s}.bg i:nth-child(3){animation-duration:38s}}
@keyframes drift{to{transform:translate(4vw,3vh) scale(1.08)}}

.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}

.app{position:relative;z-index:1;display:grid;grid-template-columns:232px minmax(0,1fr);gap:18px;min-height:100%;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Sidebar */
.side{position:sticky;top:18px;align-self:start;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:6px;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(140deg,var(--accent),var(--glow-c));display:grid;place-items:center;color:var(--accent-ink);box-shadow:0 6px 16px var(--accent-soft)}
.brand b{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:-.01em;display:block}
.brand small{color:var(--ink-3);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink-2);text-decoration:none;font-weight:500;border:1px solid transparent}
.nav a:hover{background:var(--glass-soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--glass-strong);color:var(--ink);border-color:var(--edge)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav a .count{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:99px}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--glass-soft);border:1px solid var(--edge-dim)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--edge);flex:none;position:relative}
.avatar[data-s]::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--sky-1)}
.avatar[data-s="ok"]::after{background:var(--ok)} .avatar[data-s="busy"]::after{background:var(--accent)} .avatar[data-s="pause"]::after{background:var(--pause)} .avatar[data-s="off"]::after{background:var(--off)}
.me b{display:block;font-size:13px} .me small{color:var(--ink-3);font-size:11.5px}

/* Main */
main{display:flex;flex-direction:column;gap:18px;min-width:0;padding-bottom:8px}
.top{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 20px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.top .sub{color:var(--ink-3);font-size:12.5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--glass-soft);border:1px solid var(--edge-dim);border-radius:12px;padding:8px 12px;min-width:0;width:260px;max-width:100%}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;outline:none;width:100%;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);padding:8px 12px;border-radius:12px;background:var(--glass-soft);border:1px solid var(--edge-dim);font-variant-numeric:tabular-nums}
.sample{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 9px;border-radius:99px;font-weight:600}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--glass-soft);border:1px solid var(--edge-dim);color:var(--ink-2);cursor:pointer}
.icon-btn:hover{color:var(--ink);background:var(--glass-strong)}
.icon-btn svg{width:18px;height:18px}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.view{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px}
.panel{padding:18px 20px;min-width:0}
.panel-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.panel-h .hint{color:var(--ink-3);font-size:12px}
.panel-h .act{margin-left:auto}
.label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;padding:6px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--edge-dim)}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:2px}
.kpi .d{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi.alert .v{color:var(--crit)}
.trend-up{color:var(--ok)} .trend-down{color:var(--crit)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-soft)} .chip.busy{color:var(--accent);background:var(--accent-soft)} .chip.pause{color:var(--pause);background:var(--pause-soft)} .chip.off{color:var(--off);background:var(--off-soft)} .chip.warn{color:var(--warn);background:var(--warn-soft)} .chip.crit{color:var(--crit);background:var(--crit-soft)}
.chan{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.chan svg{width:15px;height:15px}
.chan.tel svg{color:var(--accent)} .chan.wpp svg{color:var(--ok)}

/* chart */
.chart-wrap{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* queue rows */
.qlist{display:flex;flex-direction:column;gap:10px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;border-radius:var(--r-sm);background:var(--glass-soft);border:1px solid var(--edge-dim)}
.q-name{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.q-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-meta{grid-column:1/-1;display:flex;gap:16px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.q-meta b{color:var(--ink);font-weight:500}
.bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--edge-dim);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--ok)}
.bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.al{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:var(--r-sm);background:var(--glass-soft);border:1px solid var(--edge-dim);border-left:3px solid var(--warn)}
.al.crit{border-left-color:var(--crit)} .al.info{border-left-color:var(--accent)}
.al b{display:block;font-size:13px;font-weight:600}
.al p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.al time{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}

/* team mini */
.team-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.ts{padding:10px 12px;border-radius:var(--r-sm);background:var(--glass-soft);border:1px solid var(--edge-dim)}
.ts .v{font-family:var(--f-display);font-size:20px;font-weight:600}
.ts.ok .v{color:var(--ok)} .ts.busy .v{color:var(--accent)} .ts.pause .v{color:var(--pause)} .ts.off .v{color:var(--off)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:640px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--edge-dim)}
td{padding:11px 10px;border-bottom:1px solid var(--edge-dim);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:default}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--glass-soft)}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:600;display:block}
.who small{color:var(--ink-3);font-size:12px}
.over{color:var(--crit);font-weight:600}

/* filters */
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--glass-soft);border:1px solid var(--edge-dim);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}

/* atendimento detail */
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.detail{display:flex;flex-direction:column;gap:16px}
.detail-head{display:flex;gap:12px;align-items:center}
.detail-head .avatar{width:46px;height:46px;font-size:15px}
.detail-head h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.detail-head small{color:var(--ink-3)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{padding:10px 12px;border-radius:var(--r-sm);background:var(--glass-soft);border:1px solid var(--edge-dim);min-width:0}
.fact .label{display:block;margin-bottom:3px}
.fact span{overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--edge-dim);margin-left:6px;padding-left:16px}
.tl{position:relative;padding-bottom:12px}
.tl::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--glass-strong);border:2px solid var(--accent)}
.tl b{font-size:13px;font-weight:600}
.tl p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.tl time{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
textarea{width:100%;min-height:84px;resize:vertical;border-radius:var(--r-sm);border:1px solid var(--edge-dim);background:var(--glass-soft);color:var(--ink);font:inherit;padding:10px 12px}
textarea::placeholder{color:var(--ink-3)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--edge);background:var(--glass-strong);color:var(--ink);font:inherit;font-weight:500;font-size:13px;padding:9px 14px;border-radius:11px;cursor:pointer}
.btn:hover{background:var(--glass)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:10px 16px;font-weight:500}

/* queues view */
.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.qc{padding:18px;display:flex;flex-direction:column;gap:14px}
.qc-h{display:flex;align-items:center;gap:10px}
.qc-h h3{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600}
.qc-h .chip{margin-left:auto}
.qc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qc-stats div{padding:9px 10px;border-radius:10px;background:var(--glass-soft);border:1px solid var(--edge-dim)}
.qc-stats .v{font-family:var(--f-mono);font-size:17px;font-weight:500;display:block}
.qc-foot{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* base */
.kb{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.kb-item{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.kb-item h3{margin:0;font-size:14.5px;font-weight:600}
.kb-item p{margin:0;color:var(--ink-2);font-size:13px}
.kb-tag{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:99px}
.ramais{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ramal{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--glass-soft);border:1px solid var(--edge-dim)}
.ramal b{font-family:var(--f-mono);color:var(--accent)}
.empty{color:var(--ink-3);padding:18px 4px;text-align:center}

.cols-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols-2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(3){border-right:0}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--edge-dim)}
  .cols-2,.cols-2b,.split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .side{position:fixed;top:auto;left:0;right:0;bottom:0;height:auto;z-index:20;border-radius:20px 20px 0 0;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));flex-direction:row}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav a{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 4px;flex:1;text-align:center}
  .nav a .count{display:none}
  .search{width:100%;order:3}
  .top-right{width:100%}
}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-right:0;border-bottom:1px solid var(--edge-dim)}
  .kpi:nth-child(odd){border-right:1px solid var(--edge-dim)}
  .kpi:nth-last-child(-n+2){border-bottom:0}
  .team-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:19px}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

  ["07h",42,40],["08h",118,109],["09h",156,141],["10h",171,152],["11h",149,138],["12h",96,90],["13h",88,84],["14h",132,121],["15h",141,128],["16h",118,110],["17h",74,0],["18h",0,0]

const KB = [

  {tag:"Script", t:"Abertura de atendimento", d:"Cumprimentar, dizer o próprio nome, confirmar nome completo e data de nascimento antes de passar qualquer informação."},
  {tag:"LGPD", t:"Envio de resultados", d:"Resultados só podem ser enviados ao próprio paciente ou responsável legal, após confirmação de dois dados cadastrais."}
];
const RAMAIS = [["Supervisão","2010"],["Recepção Centro","2101"],["Setor técnico","2205"],["Faturamento","2300"],["Coleta domiciliar","2410"],["TI / Suporte","2500"]];

const qById = Object.fromEntries(QUEUES.map(q=>[q.id,q]));
const ST = {ok:"Disponível", busy:"Em atendimento", pause:"Em pausa", off:"Desconectado"};

/* ---------- utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini = n=>n.split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const fmt = ms=>{const t=Math.max(0,Math.floor(ms/1000));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
const chan = c=> c==="tel" ? '<span class="chan tel"><svg><use href="#i-phone"/></svg>Ligação</span>' : '<span class="chan wpp"><svg><use href="#i-wpp"/></svg>WhatsApp</span>';
const nsClass = q=> q.ns>=q.meta ? "" : (q.meta-q.ns>8 ? "crit" : "warn");
const hm = t=> new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
let query = "";
const match = (...f)=> !query || f.join(" ").toLowerCase().includes(query);

/* ---------- Painel ---------- */
function renderPainel(){
  const espera = QUEUES.reduce((a,q)=>a+q.espera,0);
  const emAt = AGENTS.filter(a=>a.s==="busy").length;
  const atend = QUEUES.reduce((a,q)=>a+q.atendidas,0);
  const nsGeral = Math.round(QUEUES.reduce((a,q)=>a+q.ns*q.atendidas,0)/atend);
  const maior = Math.min(...QUEUES.filter(q=>q.maior).map(q=>q.maior));
  const cnt = s=>AGENTS.filter(a=>a.s===s).length;

  $("#v-painel").innerHTML = `
  <div class="kpis glass">
    <div class="kpi ${espera>15?"alert":""}"><span class="label">Em espera</span><span class="v num">${espera}</span><span class="d">Maior espera <b class="num" data-since="${maior}">${fmt(Date.now()-maior)}</b></span></div>
    <div class="kpi"><span class="label">Em atendimento</span><span class="v num">${emAt}</span><span class="d">${ATEND.length} ligações e conversas abertas</span></div>
    <div class="kpi"><span class="label">Atendidos hoje</span><span class="v num">${atend}</span><span class="d"><span class="trend-up">▲ 6%</span> vs. quarta passada</span></div>
    <div class="kpi"><span class="label">Nível de serviço</span><span class="v num">${nsGeral}<small>%</small></span><span class="d">Meta 88% em até 60 s</span></div>
    <div class="kpi"><span class="label">TME</span><span class="v num">0:48</span><span class="d">Tempo médio de espera</span></div>
    <div class="kpi"><span class="label">Abandono</span><span class="v num">1,9<small>%</small></span><span class="d"><span class="trend-down">▲ 0,4 p.p.</span> desde 14h</span></div>
  </div>

  <div class="grid cols-2">
    <div class="panel glass">
      <div class="panel-h"><h2>Volume por hora</h2><span class="hint">Ligações + WhatsApp, hoje</span>
        <div class="legend act"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>Recebidos</span><span><i style="background:var(--accent)"></i>Atendidos</span></div></div>
      <div class="chart-wrap chart" id="chart"></div>
    </div>
    <div class="panel glass">
      <div class="panel-h"><h2>Alertas</h2><span class="hint">${ALERTS.length} ativos</span></div>
      <div class="alerts">${ALERTS.map(a=>`<div class="al ${a.t}"><div><b>${esc(a.h)}</b><p>${esc(a.p)}</p></div><time>${hm(a.at)}</time></div>`).join("")}</div>
    </div>
  </div>

  <div class="grid cols-2b">
    <div class="panel glass">
      <div class="panel-h"><h2>Filas</h2><span class="hint">Nível de serviço contra a meta</span><a class="act btn" href="#filas">Ver todas</a></div>
      <div class="qlist">${QUEUES.slice(0,4).map(qRow).join("")}</div>
    </div>
    <div class="panel glass">
      <div class="panel-h"><h2>Equipe agora</h2><span class="hint">${AGENTS.length} agentes no turno</span><a class="act btn" href="#agentes">Ver equipe</a></div>
      <div class="team-sum">
        <div class="ts ok"><span class="label">Disponíveis</span><div class="v num">${cnt("ok")}</div></div>
        <div class="ts busy"><span class="label">Atendendo</span><div class="v num">${cnt("busy")}</div></div>
        <div class="ts pause"><span class="label">Pausa</span><div class="v num">${cnt("pause")}</div></div>
        <div class="ts off"><span class="label">Offline</span><div class="v num">${cnt("off")}</div></div>
      </div>
      <div class="tbl-wrap"><table style="min-width:420px"><tbody>
        ${AGENTS.filter(a=>a.s!=="off").sort((a,b)=>a.since-b.since).slice(0,5).map(a=>`<tr>
          <td><div class="who"><div class="avatar" data-s="${a.s}">${ini(a.n)}</div><div><b>${esc(a.n)}</b><small>${esc(qById[a.fila].nome)}</small></div></div></td>
          <td><span class="chip ${a.s}">${a.pausa&&a.s==="pause"?esc(a.pausa):ST[a.s]}</span></td>
          <td class="num" style="text-align:right" data-since="${a.since}" ${a.lim?`data-lim="${a.lim}"`:""}>${fmt(Date.now()-a.since)}</td></tr>`).join("")}
      </tbody></table></div>
    </div>
  </div>`;
  drawChart();
}
function qRow(q){
  const c = nsClass(q);
  return `<div class="q">
    <div class="q-name">${q.canal==="tel"?'<svg width="15" height="15" style="color:var(--accent)"><use href="#i-phone"/></svg>':'<svg width="15" height="15" style="color:var(--ok)"><use href="#i-wpp"/></svg>'}<span>${esc(q.nome)}</span></div>
    <div class="num" style="font-weight:600;${c?`color:var(--${c})`:""}">${q.ns}%</div>
    <div class="bar"><i class="${c}" style="width:${q.ns}%"></i></div>
    <div class="q-meta"><span>Em espera <b class="num">${q.espera}</b></span><span>Maior espera <b class="num" ${q.maior?`data-since="${q.maior}"`:""}>${q.maior?fmt(Date.now()-q.maior):"—"}</b></span><span>Meta <b class="num">${q.meta}%</b></span></div>
  </div>`;
}
function drawChart(){
  const W=640,H=240,pl=36,pr=10,pt=12,pb=28;
  const max=200, iw=W-pl-pr, ih=H-pt-pb, n=VOLUME.length, bw=iw/n;
  const y=v=>pt+ih-(v/max)*ih;
  let g="";
  for(let v=0;v<=max;v+=50){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--edge-dim)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace">${v}</text>`}
  const cur = new Date().getHours();
  VOLUME.forEach(([h,r,a],i)=>{
    const x=pl+i*bw+bw*.18, w=bw*.64;
    if(r) g+=`<rect x="${x}" y="${y(r)}" width="${w}" height="${y(0)-y(r)}" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-opacity=".45"/>`;
    if(a) g+=`<rect x="${x+w*.18}" y="${y(a)}" width="${w*.64}" height="${y(0)-y(a)}" rx="4" fill="var(--accent)"/>`;
    const isCur = parseInt(h)===cur;
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="${isCur?"var(--ink)":"var(--ink-3)"}" font-weight="${isCur?600:400}" font-family="IBM Plex Mono, monospace">${h}</text>`;
  });
  $("#chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras de atendimentos recebidos e atendidos por hora">${g}</svg>`;
}

/* ---------- Atendimentos ---------- */
let selAt = ATEND[0].p, filtroCanal="todos";
function renderAtend(){
  const list = ATEND.filter(a=>(filtroCanal==="todos"||a.c===filtroCanal) && match(a.p,a.cli,a.ag,a.motivo,a.tel));
  if(list.length && !list.find(a=>a.p===selAt)) selAt=list[0].p;
  const s = ATEND.find(a=>a.p===selAt);
  $("#v-atendimentos").innerHTML = `
  <div class="split">
    <div class="panel glass">
      <div class="panel-h"><h2>Em andamento</h2><span class="hint">${list.length} de ${ATEND.length}</span>
        <div class="seg act" role="group" aria-label="Filtrar por canal">
          ${[["todos","Todos"],["tel","Ligação"],["wpp","WhatsApp"]].map(([k,l])=>`<button type="button" data-canal="${k}" aria-pressed="${filtroCanal===k}">${l}</button>`).join("")}
        </div></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Paciente</th><th>Canal</th><th>Agente</th><th style="text-align:right">Duração</th></tr></thead>
        <tbody>${list.length?list.map(a=>`<tr class="clickable ${a.p===selAt?"sel":""}" data-p="${a.p}" tabindex="0">
          <td><div class="who"><div class="avatar">${ini(a.cli)}</div><div><b>${esc(a.cli)}</b><small>${esc(a.motivo)}</small></div></div></td>
          <td>${chan(a.c)}</td>
          <td>${esc(a.ag.split(" ")[0])}</td>
          <td class="num" style="text-align:right" data-since="${a.ini}" data-lim="${a.sla}">${fmt(Date.now()-a.ini)}</td></tr>`).join("")
          :`<tr><td colspan="4" class="empty">Nenhum atendimento encontrado para essa busca.</td></tr>`}</tbody>
      </table></div>
    </div>
    ${s?`<div class="panel glass detail">
      <div class="detail-head"><div class="avatar">${ini(s.cli)}</div><div><h3>${esc(s.cli)}</h3><small class="num">Protocolo ${s.p}</small></div><span class="act" style="margin-left:auto">${chan(s.c)}</span></div>
      <div class="facts">
        <div class="fact"><span class="label">Telefone</span><span class="num">${esc(s.tel)}</span></div>
        <div class="fact"><span class="label">Convênio</span><span>${esc(s.conv)}</span></div>
        <div class="fact"><span class="label">Fila</span><span>${esc(qById[s.fila].nome)}</span></div>
        <div class="fact"><span class="label">Unidade</span><span>${esc(s.unidade)}</span></div>
        <div class="fact"><span class="label">Agente</span><span>${esc(s.ag)}</span></div>
        <div class="fact"><span class="label">Último atendimento</span><span>${esc(s.ult)}</span></div>
      </div>
      <div><span class="label">Motivo do contato</span><p style="margin:4px 0 0">${esc(s.motivo)}</p></div>
      <div><span class="label" style="display:block;margin-bottom:10px">Linha do tempo</span>
        <div class="timeline">
          <div class="tl"><time>${hm(s.ini-90000)}</time><br><b>Entrou na fila</b><p>${esc(qById[s.fila].nome)}</p></div>
          <div class="tl"><time>${hm(s.ini)}</time><br><b>Atendido por ${esc(s.ag.split(" ")[0])}</b><p>Identidade confirmada (nome e data de nascimento)</p></div>
          <div class="tl"><time>agora</time><br><b>Em andamento</b><p class="num" data-since="${s.ini}">${fmt(Date.now()-s.ini)}</p></div>
        </div></div>
      <div><label class="label" for="nota" style="display:block;margin-bottom:6px">Anotação do atendimento</label>
        <textarea id="nota" placeholder="Registre o que foi resolvido ou o próximo passo"></textarea></div>
      <div class="btns"><button class="btn primary" type="button" data-act="Anotação salva">Salvar anotação</button><button class="btn" type="button" data-act="Transferência solicitada">Transferir</button><button class="btn" type="button" data-act="Atendimento finalizado">Finalizar</button></div>
    </div>`:`<div class="panel glass empty">Selecione um atendimento para ver a ficha do paciente.</div>`}
  </div>`;
}

/* ---------- Agentes ---------- */
let filtroSt="todos";
function renderAgentes(){
  const list = AGENTS.filter(a=>(filtroSt==="todos"||a.s===filtroSt) && match(a.n,qById[a.fila].nome));
  $("#v-agentes").innerHTML = `
  <div class="panel glass">
    <div class="panel-h"><h2>Equipe do turno</h2><span class="hint">${list.length} agentes</span>
      <div class="seg act" role="group" aria-label="Filtrar por status">
        ${[["todos","Todos"],["ok","Disponíveis"],["busy","Atendendo"],["pause","Pausa"],["off","Offline"]].map(([k,l])=>`<button type="button" data-st="${k}" aria-pressed="${filtroSt===k}">${l}</button>`).join("")}
      </div></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Agente</th><th>Canal</th><th>Status</th><th style="text-align:right">No status</th><th style="text-align:right">Atendidos hoje</th><th style="text-align:right">TMA</th></tr></thead>
      <tbody>${list.length?list.map(a=>`<tr>
        <td><div class="who"><div class="avatar" data-s="${a.s}">${ini(a.n)}</div><div><b>${esc(a.n)}</b><small>${esc(qById[a.fila].nome)}</small></div></div></td>
        <td>${chan(a.c)}</td>
        <td><span class="chip ${a.s}">${ST[a.s]}${a.pausa?` · ${esc(a.pausa)}`:""}</span></td>
        <td class="num" style="text-align:right" data-since="${a.since}" ${a.lim?`data-lim="${a.lim}"`:""}>${fmt(Date.now()-a.since)}</td>
        <td class="num" style="text-align:right">${a.hoje}</td>
        <td class="num" style="text-align:right">${a.tma}</td></tr>`).join("")
        :`<tr><td colspan="6" class="empty">Nenhum agente com esse filtro.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

/* ---------- Filas ---------- */
function renderFilas(){
  const list = QUEUES.filter(q=>match(q.nome));
  $("#v-filas").innerHTML = list.length ? `<div class="qcards">${list.map(q=>{
    const c=nsClass(q);
    const ags=AGENTS.filter(a=>a.fila===q.id && a.s!=="off");
    return `<article class="qc glass">
      <div class="qc-h">${q.canal==="tel"?'<svg width="18" height="18" style="color:var(--accent)"><use href="#i-phone"/></svg>':'<svg width="18" height="18" style="color:var(--ok)"><use href="#i-wpp"/></svg>'}<h3>${esc(q.nome)}</h3>
        <span class="chip ${c||"ok"}">${c?"Abaixo da meta":"Na meta"}</span></div>
      <div class="qc-stats">
        <div><span class="label">Espera</span><span class="v">${q.espera}</span></div>
        <div><span class="label">Maior</span><span class="v" ${q.maior?`data-since="${q.maior}"`:""}>${q.maior?fmt(Date.now()-q.maior):"—"}</span></div>
        <div><span class="label">Abandono</span><span class="v">${String(q.abandono).replace(".",",")}%</span></div>
      </div>
      <div class="q" style="padding:0;background:none;border:0"><div class="q-name"><span>Nível de serviço</span></div><div class="num" style="font-weight:600;${c?`color:var(--${c})`:""}">${q.ns}% <span style="color:var(--ink-3);font-weight:400">/ ${q.meta}%</span></div><div class="bar"><i class="${c}" style="width:${q.ns}%"></i></div></div>
      <div class="qc-foot"><span>${q.atendidas} atendidos hoje</span><span>${ags.length} agentes logados</span></div>
    </article>`}).join("")}</div>` : `<div class="panel glass empty">Nenhuma fila encontrada.</div>`;
}

/* ---------- Consulta ---------- */
function renderBase(){
  const list = KB.filter(k=>match(k.tag,k.t,k.d));
  $("#v-base").innerHTML = `
  <div class="panel glass">
    <div class="panel-h"><h2>Ramais internos</h2><span class="hint">Para transferências e dúvidas</span></div>
    <div class="ramais">${RAMAIS.map(([n,r])=>`<div class="ramal"><span>${esc(n)}</span><b>${r}</b></div>`).join("")}</div>
  </div>
  <div class="panel-h" style="margin:4px 4px -4px"><h2>Procedimentos e respostas</h2><span class="hint">${list.length} itens · use a busca no topo</span></div>
  ${list.length?`<div class="kb">${list.map(k=>`<article class="kb-item glass"><span class="kb-tag">${esc(k.tag)}</span><h3>${esc(k.t)}</h3><p>${esc(k.d)}</p></article>`).join("")}</div>`:`<div class="panel glass empty">Nada encontrado. Tente outro termo.</div>`}`;
}

/* ---------- roteamento ---------- */
const VIEWS = {
  painel:{t:"Painel", s:"Visão da operação em tempo real", r:renderPainel},
  atendimentos:{t:"Atendimentos", s:"Ligações e conversas em andamento", r:renderAtend},
  agentes:{t:"Agentes", s:"Status e produtividade da equipe", r:renderAgentes},
  filas:{t:"Filas", s:"Espera, abandono e nível de serviço por fila", r:renderFilas},
  base:{t:"Consulta rápida", s:"Preparos, regras e ramais para o atendimento", r:renderBase}
};
let cur="painel";
function route(){
  const h=(location.hash||"").slice(1);
  cur = VIEWS[h] ? h : "painel";
  for(const k in VIEWS) $("#v-"+k).hidden = k!==cur;
  document.querySelectorAll("#nav a").forEach(a=>{ if(a.dataset.v===cur) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#title").textContent=VIEWS[cur].t; $("#subtitle").textContent=VIEWS[cur].s;
  VIEWS[cur].r(); tick();
}
window.addEventListener("hashchange",route);

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-canal]"); if(b){filtroCanal=b.dataset.canal;renderAtend();tick();return}
  const s=e.target.closest("[data-st]"); if(s){filtroSt=s.dataset.st;renderAgentes();tick();return}
  const r=e.target.closest("tr[data-p]"); if(r){selAt=r.dataset.p;renderAtend();tick();return}
  const a=e.target.closest("[data-act]"); if(a){toast(a.dataset.act+" (protótipo)")}
});
document.addEventListener("keydown",e=>{const r=e.target.closest&&e.target.closest("tr[data-p]"); if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selAt=r.dataset.p;renderAtend();tick();document.querySelector(`tr[data-p="${selAt}"]`)?.focus()}});
$("#q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase(); if(cur==="painel"&&query){location.hash="atendimentos"} else {VIEWS[cur].r();tick()}});

let tt; function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* tema */
$("#theme").addEventListener("click",()=>{
  const root=document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try{localStorage.setItem("central-tema",root.dataset.theme)}catch(_){}
});
try{const t=localStorage.getItem("central-tema"); if(t) document.documentElement.dataset.theme=t}catch(_){}

/* relógio e cronômetros */
function tick(){
  const n=Date.now();
  $("#clock").textContent=new Date(n).toLocaleTimeString("pt-BR");
  document.querySelectorAll("[data-since]").forEach(el=>{
    const ms=n-Number(el.dataset.since); el.textContent=fmt(ms);
    if(el.dataset.lim) el.classList.toggle("over", ms>Number(el.dataset.lim)*60000);
  });
}
$("#nav-at").textContent=ATEND.length;
$("#nav-fila").textContent=QUEUES.reduce((a,q)=>a+q.espera,0);
route(); setInterval(tick,1000);
})();
</script>
</body>
</html>
