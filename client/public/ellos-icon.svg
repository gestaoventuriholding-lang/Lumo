<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 44 44">
  <style>
    .link { stroke: #0B1F44; }
    @media (prefers-color-scheme: dark) { .link { stroke: #FFFFFF; } }
  </style>
  <defs>
    <clipPath id="right"><rect x="24" y="-20" width="40" height="90"/></clipPath>
    <!-- recorta o elo azul onde o elo claro passa por cima -->
    <mask id="cutA" maskUnits="userSpaceOnUse" x="-20" y="-20" width="100" height="100">
      <rect x="-20" y="-20" width="100" height="100" fill="#fff"/>
      <rect x="7" y="11" width="34" height="17" rx="8.5" fill="none" stroke="#000" stroke-width="9.5"/>
    </mask>
    <!-- recorta o elo claro onde o azul passa por cima (metade direita) -->
    <mask id="cutB" maskUnits="userSpaceOnUse" x="-20" y="-20" width="100" height="100">
      <rect x="-20" y="-20" width="100" height="100" fill="#fff"/>
      <g clip-path="url(#right)">
        <rect x="7" y="20" width="34" height="17" rx="8.5" fill="none" stroke="#000" stroke-width="9.5"/>
      </g>
    </mask>
  </defs>
  <g transform="rotate(-45 24 24)" fill="none" stroke-width="5.5" stroke-linecap="round">
    <rect x="7" y="20" width="34" height="17" rx="8.5" stroke="#3366FF" mask="url(#cutA)"/>
    <rect class="link" x="7" y="11" width="34" height="17" rx="8.5" mask="url(#cutB)"/>
    <g clip-path="url(#right)">
      <rect x="7" y="20" width="34" height="17" rx="8.5" stroke="#3366FF"/>
    </g>
  </g>
</svg>
